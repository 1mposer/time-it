# Server test suite on every push and pull request. The suite is pure —
# fakes for the weather provider, db, and APNs — so no secrets or services
# are needed; `npm test` is `node --test` over tests/**. The iOS app has no
# CI here (Xcode builds need a macOS runner and the Figma-gated design flow).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    name: server tests (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
