summary: |
  When the app falls back to its saved forecast the footer shows a clock time but no date, so an old forecast can read as today's.
proposal: |
  Show the forecast's date in the footer whenever the saved forecast is not from today. Render change, so it needs a Figma frame first (ADR-0008).
acceptance: |
  - a forecast from an earlier day shows its date in the footer
  - a same-day forecast reads as before
