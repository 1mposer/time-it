id: PR-028
title: Verify push addresses at registration and periodically
type: Enhancement
priority: Low
status: Backlog
area: Notifications
owner: Yaas
effort: M
reported: 2026-11-18
found_in: 1.0 (11)
fixed_in: null
issue: https://github.com/1mposer/time-it/issues/57
source:
  - ship gate ruling R-01 and amendment A-1 (address verification left for post-1.0)
  - ship gate S-12 remainder
summary: |
  A push address is only found stale when a send to it fails. Verifying an address when it is new or changed, and re-verifying periodically, was scoped during the ship gate and moved after 1.0 (Captain amendment A-1).
proposal: |
  Verify an address when it is new or changed, and add a weekly low-cost pass that re-verifies addresses and deactivates the ones the provider reports as dead, with the same safeguards as the send path.
acceptance: |
  - a weekly pass re-verifies addresses
  - unknown outcomes never deactivate a device
decision_needed: null
