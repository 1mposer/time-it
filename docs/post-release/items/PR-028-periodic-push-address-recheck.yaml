summary: |
  The 1.0 hardening verifies a push address when it is new or changed. Addresses that go stale later are only found when a send fails.
proposal: |
  A weekly low-cost pass that re-verifies addresses and deactivates the ones the provider reports as dead, with the same safeguards as the send path.
acceptance: |
  - a weekly pass re-verifies addresses
  - unknown outcomes never deactivate a device
