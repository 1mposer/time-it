summary: |
  Tapping a metric tile expands a slider inline, so the tiles below jump down under the
  finger. Option a keeps tile positions and docks the open slider below the grid; option
  b opens the slider in a bottom sheet (a half-height modal over the grid).
proposal: |
  Pending the owner's answer: a = slider docked below the grid, grid fixed; b = slider
  in a presented sheet (.presentationDetents([.medium])) with the tile highlighted.
acceptance: |
  - no tile moves when another tile's slider opens
  - UI test opens two tiles in turn and reads the first tile's frame unchanged
decision_needed: |
  a or b — the owner asked "what sheet?" on 2026-11-12; explain and re-ask.
