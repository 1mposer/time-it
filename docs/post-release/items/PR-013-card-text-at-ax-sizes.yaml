summary: |
  The header stops growing at xxxLarge (POLISH item 6), but on the card the title and
  the "Score" label keep the full Dynamic Type range while the ring numeral is capped,
  so at AX3–AX5 the words outgrow the number they label.
proposal: |
  Cap the card title and the "Score" label at the same step as the ring numeral, or
  scale the ring with them; one AX screenshot pass per step. Decide with the score/range
  redesign (ROADMAP row 22) so the card is not touched twice.
acceptance: |
  - at AX5 the "Score" label never reads larger than the numeral
  - the UI test testCardStripNumeralsNeverOverlapAtAccessibilityXXXL stays green
