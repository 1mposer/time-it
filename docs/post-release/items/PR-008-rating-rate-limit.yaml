  Per-IP (or per device id when sent) sliding-window limit in the feedback route's
  shape, 429 in the uniform errors envelope, tests in tests/server/.
acceptance: |
  - a burst past the ceiling gets 429 with the envelope; under it, unchanged responses
  - the iOS client treats 429 like a transient error (keeps the cached forecast)
